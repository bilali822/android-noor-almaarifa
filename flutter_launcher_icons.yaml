flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # 🌟 تفعيل الأيقونات التكيفية (Adaptive Icons)
  adaptive_icon_background: "#0B101E" # نفس لون الخلفية الكحلي في صورتك
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0b101e"
    theme_color: "#155e35"
