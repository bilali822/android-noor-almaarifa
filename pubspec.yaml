name: noor_app
description: "نور المعرفة - القرآن الكريم"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  hijri: ^3.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.3
  flutter_timezone: ^1.0.8

  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  http: ^1.2.2
  audioplayers: ^6.0.0
  share_plus: ^9.0.0
  screenshot: ^3.0.0
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/noor_quran.db
    - assets/images/islamic_pattern.png

  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
